<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전체 로드맵 검색</title>
    <link rel="stylesheet" href="../css/roadmap.css" />
  </head>
  <body>
    <div class="main-wrapper">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px">
        <div class="section-title" style="margin: 0;">
          전체 로드맵 찾기
        </div>
        
        <button 
          onclick="window.location.href='roadmap-create.html'" 
          style="padding: 6px 12px; background-color: #555; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
          + 임시 생성
        </button>
      </div>
      
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="ADsP, 토익 등 자격증 검색"
          onkeyup="filterRoadmaps()"
        />
        <button class="search-btn">🔍</button>
      </div>

      <div class="section">
        <div class="card-grid" id="resultGrid"></div>
      </div>
    </div>
    
    <script src="../js/search.js"></script>
  </body>
</html>
